# Local stand-ins for the Azure pipeline:
#   APIM + HTTP Function  -> api (FastAPI, same schema/steps)
#   Blob Storage          -> Azurite
#   Event Hubs            -> official Event Hubs emulator
#   Event Hub -> Cosmos fn -> worker
#   Cosmos DB (NoSQL)     -> Cosmos DB Linux emulator (vNext, arm64 + x64)
#   Power BI              -> React live view
x-app: &app
  build: .
  image: azure-streaming-pipeline/stream:local
  env_file:
    - path: .env
      required: false
  environment:
    # Local emulator credentials only. Override in .env; never put real Azure keys in this file.
    AZURITE_ACCOUNT_NAME: ${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
    AZURITE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}  # publicly documented Azurite dev key (the Event Hubs emulator also uses it)
    EVENTHUBS_SAS_KEY: ${EVENTHUBS_SAS_KEY:-SAS_KEY_VALUE}
    COSMOS_KEY: ${COSMOS_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}  # fixed, publicly documented Cosmos emulator key
  restart: unless-stopped

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000", "10001:10001", "10002:10002"]

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    volumes:
      - ./emulators/eventhubs-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      # Running the emulator requires accepting Microsoft's emulator license terms:
      # https://github.com/Azure/azure-event-hubs-emulator-installer/blob/main/EMULATOR_EULA.txt
      ACCEPT_EULA: ${EVENTHUBS_EMULATOR_ACCEPT_EULA:-Y}
    ports: ["5672:5672", "9092:9092", "5300:5300"]
    depends_on: [azurite]

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    environment:
      PROTOCOL: http
    ports: ["8081:8081", "1234:1234"]  # 1234 = Data Explorer

  api:
    <<: *app
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: [azurite, eventhubs-emulator, cosmos]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health'))['status']=='ok' else 1)"]
      interval: 5s
      retries: 60

  worker:
    <<: *app
    command: ["python", "-m", "stream.worker"]
    depends_on: [azurite, eventhubs-emulator, cosmos]

  producer:
    <<: *app
    command: ["python", "-m", "stream.producer"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on: [api]
